# Pinned so a build here, on a fresh machine, or in CI produces the same
# binary. Cargo.lock already pins every dependency; this pins the compiler that
# consumes it, which was the remaining reproducibility gap.
#
# rustup reads this by walking up from the working directory, so it applies
# whether cargo is invoked from the repo root or from gui/.
[toolchain]
channel = "1.97.1"
targets = ["x86_64-pc-windows-msvc"]
components = ["rustfmt", "clippy"]
